name = "ktech-crm"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[build.upload]
format = "modules"
main = "./.open-next/worker.js"

[[build.upload.rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[build.upload.rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[env.production]
routes = [
  { pattern = "ktech.edu", custom_domain = true }
]

[env.staging]
routes = [
  { pattern = "staging.ktech.edu", custom_domain = true }
]
